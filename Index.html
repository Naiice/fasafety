<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welding Training Monitor</title>
  
  <!-- โหลด Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- โหลด React และ ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- โหลด Babel สำหรับแปลง JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
    /* Loading Spinner */
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    /* ซ่อน Scrollbar บางจุดเพื่อความสวยงาม */
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // --- ไอคอนแบบ SVG (ลดการพึ่งพา Library ภายนอกเพื่อให้รันบน GAS ได้ลื่นไหล) ---
    const Icons = {
      ClipboardCheck: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>,
      BarChart3: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M18 20V10M12 20V4M6 20v-6"></path></svg>,
      CalendarDays: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>,
      Users: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>,
      CheckCircle2: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      XCircle: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      Clock: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
      Search: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>,
      Save: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>,
      X: ({className}) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>,
    };

    function App() {
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [trainees, setTrainees] = useState([]);
      const [trainingDates, setDates] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      
      const [evalModalOpen, setEvalModalOpen] = useState(false);
      const [currentEval, setCurrentEval] = useState(null);
      const [saving, setSaving] = useState(false);

      // --- ดึงข้อมูลจาก Google Sheets ---
      useEffect(() => {
        if (typeof google !== 'undefined' && google.script) {
          google.script.run.withSuccessHandler((dataString) => {
            try {
              const data = JSON.parse(dataString);
              setTrainees(data.trainees);
              setDates(data.dates);
            } catch (e) {
              console.error("Error parsing data", e);
            }
            setLoading(false);
          }).withFailureHandler((error) => {
            alert("ไม่สามารถดึงข้อมูลได้: " + error);
            setLoading(false);
          }).getSheetData();
        } else {
          // ถ้าไม่ได้รันผ่าน GAS (เปิดดูธรรมดา) จะจำลองให้เห็น Loading แปปนึง
          setTimeout(() => {
             alert("กรุณารันโปรแกรมนี้ผ่าน Google Apps Script เพื่อดึงข้อมูลจริงจาก Sheet");
             setLoading(false);
          }, 1000);
        }
      }, []);

      const stats = useMemo(() => {
        const total = trainees.length;
        const passed = trainees.filter(t => t.status === 'Pass').length;
        const notPass = trainees.filter(t => t.status === 'Not Pass').length;
        const pending = trainees.filter(t => t.status === 'Pending').length;
        return { total, passed, notPass, pending, passRate: total ? Math.round((passed / total) * 100) : 0 };
      }, [trainees]);

      const filteredTrainees = useMemo(() => {
        return trainees.filter(t => 
          t.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
          t.id.includes(searchQuery)
        );
      }, [trainees, searchQuery]);

      // --- บันทึกข้อมูลลง Google Sheets ---
      const handleSaveEvaluation = (id, scores) => {
        setSaving(true);
        const totalScore = (Number(scores.flame) || 0) + (Number(scores.quality) || 0) + (Number(scores.wire) || 0);
        const newStatus = totalScore >= 25 ? 'Pass' : 'Not Pass';

        if (typeof google !== 'undefined' && google.script) {
          google.script.run.withSuccessHandler((success) => {
            setSaving(false);
            if (success) {
              setTrainees(prev => prev.map(t => 
                t.id === id ? { ...t, scores, status: newStatus } : t
              ));
              setEvalModalOpen(false);
            } else {
              alert('เกิดข้อผิดพลาด ไม่พบ ID นี้ในระบบ');
            }
          }).saveEvaluation(id, scores, newStatus);
        } else {
          // จำลองการเซฟตอนไม่ได้อยู่บน GAS
          setTimeout(() => {
             setTrainees(prev => prev.map(t => t.id === id ? { ...t, scores, status: newStatus } : t));
             setEvalModalOpen(false);
             setSaving(false);
          }, 500);
        }
      };

      const openEvalModal = (trainee) => {
        setCurrentEval({
          ...trainee,
          tempScores: { 
            flame: trainee.scores?.flame ?? '', 
            quality: trainee.scores?.quality ?? '', 
            wire: trainee.scores?.wire ?? '' 
          }
        });
        setEvalModalOpen(true);
      };

      if (loading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50">
            <div className="loader mb-4"></div>
            <p className="text-slate-600 font-medium text-lg">กำลังเชื่อมต่อข้อมูลจาก Google Sheets...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans">
          {/* Navigation */}
          <nav className="bg-blue-900 text-white shadow-lg">
            <div className="max-w-7xl mx-auto px-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between h-auto sm:h-16 py-3 sm:py-0">
                <div className="flex items-center space-x-3 mb-3 sm:mb-0">
                  <Icons.ClipboardCheck className="h-8 w-8 text-blue-300" />
                  <span className="font-bold text-lg sm:text-xl tracking-wide">Welding Training Monitor</span>
                </div>
                <div className="flex flex-wrap gap-1">
                  <NavButton icon={<Icons.BarChart3 />} label="แดชบอร์ด" isActive={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                  <NavButton icon={<Icons.CalendarDays />} label="แผนการอบรม" isActive={activeTab === 'plan'} onClick={() => setActiveTab('plan')} />
                  <NavButton icon={<Icons.ClipboardCheck />} label="ประเมินผล" isActive={activeTab === 'evaluate'} onClick={() => setActiveTab('evaluate')} />
                </div>
              </div>
            </div>
          </nav>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-4 py-6">
            {activeTab === 'dashboard' && <DashboardView stats={stats} />}
            {activeTab === 'plan' && <TrainingPlanView trainees={filteredTrainees} searchQuery={searchQuery} setSearchQuery={setSearchQuery} dates={trainingDates} Icons={Icons} />}
            {activeTab === 'evaluate' && <EvaluationView trainees={filteredTrainees} searchQuery={searchQuery} setSearchQuery={setSearchQuery} onEvaluate={openEvalModal} Icons={Icons} />}
          </main>

          {/* Evaluation Modal */}
          {evalModalOpen && currentEval && (
            <EvaluationModal 
              trainee={currentEval} 
              onClose={() => setEvalModalOpen(false)} 
              onSave={handleSaveEvaluation} 
              saving={saving}
              Icons={Icons}
            />
          )}
        </div>
      );
    }

    // ================= Components =================

    function NavButton({ icon, label, isActive, onClick }) {
      return (
        <button
          onClick={onClick}
          className={`flex items-center space-x-2 px-3 py-2 rounded-md transition-colors text-sm ${
            isActive ? 'bg-blue-800 text-white font-medium shadow-inner' : 'text-blue-100 hover:bg-blue-800/50'
          }`}
        >
          {React.cloneElement(icon, { className: 'h-5 w-5' })}
          <span className="inline">{label}</span>
        </button>
      );
    }

    function StatusBadge({ status, Icons }) {
      switch (status) {
        case 'Pass':
          return <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800"><Icons.CheckCircle2 className="w-3 h-3 mr-1" /> ผ่านการอบรม</span>;
        case 'Not Pass':
          return <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800"><Icons.XCircle className="w-3 h-3 mr-1" /> ไม่ผ่าน</span>;
        default:
          return <span className="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800"><Icons.Clock className="w-3 h-3 mr-1" /> รอประเมิน</span>;
      }
    }

    function DashboardView({ stats }) {
      return (
        <div className="space-y-6">
          <h2 className="text-2xl font-bold text-slate-800">ภาพรวมการอบรมช่างเชื่อม (Final Assembly)</h2>
          
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center space-x-4">
              <div className="p-3 bg-blue-100 text-blue-600 rounded-lg hidden sm:block"><Icons.Users className="h-6 w-6" /></div>
              <div>
                <p className="text-xs sm:text-sm font-medium text-slate-500">ผู้เข้าอบรมทั้งหมด</p>
                <p className="text-xl sm:text-2xl font-bold text-slate-800">{stats.total} คน</p>
              </div>
            </div>
            <div className="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center space-x-4">
              <div className="p-3 bg-green-100 text-green-600 rounded-lg hidden sm:block"><Icons.CheckCircle2 className="h-6 w-6" /></div>
              <div>
                <p className="text-xs sm:text-sm font-medium text-slate-500">ผ่านการอบรม</p>
                <p className="text-xl sm:text-2xl font-bold text-green-600">{stats.passed} คน</p>
              </div>
            </div>
            <div className="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center space-x-4">
              <div className="p-3 bg-red-100 text-red-600 rounded-lg hidden sm:block"><Icons.XCircle className="h-6 w-6" /></div>
              <div>
                <p className="text-xs sm:text-sm font-medium text-slate-500">ไม่ผ่าน</p>
                <p className="text-xl sm:text-2xl font-bold text-red-600">{stats.notPass} คน</p>
              </div>
            </div>
            <div className="bg-white p-4 sm:p-6 rounded-xl shadow-sm border border-slate-100 flex items-center space-x-4">
              <div className="p-3 bg-yellow-100 text-yellow-600 rounded-lg hidden sm:block"><Icons.Clock className="h-6 w-6" /></div>
              <div>
                <p className="text-xs sm:text-sm font-medium text-slate-500">รอการประเมิน</p>
                <p className="text-xl sm:text-2xl font-bold text-yellow-600">{stats.pending} คน</p>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
            <h3 className="text-lg font-bold text-slate-800 mb-4">กราฟสรุปอัตราการผ่านการอบรม</h3>
            <div className="flex flex-col md:flex-row items-center gap-8">
              <div className="w-full md:w-1/2 space-y-4">
                <div className="space-y-2">
                  <div className="flex justify-between text-sm">
                    <span className="font-medium text-slate-600">ผ่านการอบรม</span>
                    <span className="font-bold text-green-600">{stats.passRate}%</span>
                  </div>
                  <div className="h-4 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div className="h-full bg-green-500" style={{ width: `${stats.passRate}%` }}></div>
                  </div>
                </div>
                <div className="space-y-2">
                  <div className="flex justify-between text-sm">
                    <span className="font-medium text-slate-600">ไม่ผ่าน</span>
                    <span className="font-bold text-red-600">{stats.total ? Math.round((stats.notPass / stats.total) * 100) : 0}%</span>
                  </div>
                  <div className="h-4 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div className="h-full bg-red-500" style={{ width: `${stats.total ? (stats.notPass / stats.total) * 100 : 0}%` }}></div>
                  </div>
                </div>
              </div>
              <div className="w-full md:w-1/2 p-4 bg-slate-50 rounded-lg text-sm text-slate-600">
                <h4 className="font-bold text-slate-800 mb-2">เกณฑ์การประเมิน</h4>
                <ul className="list-disc pl-5 space-y-1">
                  <li>การปรับเปลวไฟ (10 คะแนน)</li>
                  <li>คุณภาพการเชื่อม (10 คะแนน)</li>
                  <li>การเติมลวดเชื่อม (10 คะแนน)</li>
                </ul>
                <p className="mt-3 text-blue-700 bg-blue-50 p-2 rounded border border-blue-100">
                  * เกณฑ์ผ่านคือ <strong>25 คะแนนขึ้นไป</strong> (จาก 30 คะแนน)
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TrainingPlanView({ trainees, searchQuery, setSearchQuery, dates, Icons }) {
      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-100 flex flex-col h-[calc(100vh-180px)]">
          <div className="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50 rounded-t-xl gap-3">
            <h2 className="text-xl font-bold text-slate-800">แผนการอบรม (ภาพรวม)</h2>
            <div className="relative w-full sm:w-auto">
              <Icons.Search className="h-5 w-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
              <input 
                type="text" 
                placeholder="ค้นหาชื่อ หรือ รหัสพนักงาน..." 
                className="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-64"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
            </div>
          </div>
          
          <div className="overflow-x-auto flex-1 relative">
            <table className="w-full text-sm text-left whitespace-nowrap min-w-max border-collapse">
              <thead className="text-xs text-slate-600 uppercase bg-slate-100 sticky top-0 z-20 shadow-sm">
                <tr>
                  <th className="px-4 py-3 font-semibold sticky left-0 z-30 bg-slate-100 border-r border-slate-200 shadow-[1px_0_0_0_#e2e8f0]">รหัส - ชื่อพนักงาน</th>
                  <th className="px-3 py-3 font-semibold text-center border-r border-slate-200 bg-slate-100">Line</th>
                  <th className="px-3 py-3 font-semibold text-center border-r border-slate-200 bg-slate-100">ผู้ฝึกสอน</th>
                  {dates.map(date => {
                    const parts = date.split('/');
                    const day = parts[0];
                    const monthYear = parts.slice(1).join('/');
                    return (
                      <th key={date} className="px-2 py-2 font-semibold text-center border-r border-slate-200 min-w-[70px] bg-white">
                        <div className="flex flex-col items-center justify-center">
                          <span className="text-lg font-bold text-blue-700 leading-tight">{day}</span>
                          <span className="text-[10px] text-slate-500">{monthYear}</span>
                        </div>
                      </th>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {trainees.map((t, idx) => {
                  const rowBgClass = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50';
                  return (
                    <tr key={t.id} className={`border-b border-slate-100 hover:bg-blue-50/50 ${rowBgClass}`}>
                      {/* Sticky Column - Name */}
                      <td className={`px-4 py-3 font-medium text-slate-800 sticky left-0 z-10 border-r border-slate-200 shadow-[1px_0_0_0_#e2e8f0] ${rowBgClass}`}>
                        <div className="truncate max-w-[180px]" title={t.name}>{t.name}</div>
                        <div className="text-xs text-slate-500">{t.id}</div>
                      </td>
                      
                      <td className="px-3 py-3 text-center border-r border-slate-100">{t.line}</td>
                      <td className="px-3 py-3 text-center border-r border-slate-200">{t.trainer}</td>
                      
                      {/* Date Cells (Gantt Chart style) */}
                      {dates.map(date => {
                        const isPlaned = t.schedule[date] === "Planed" || t.schedule[date] === "Planned";
                        return (
                          <td key={date} className="p-1 border-r border-slate-100 text-center relative group">
                            {isPlaned ? (
                              <div className="h-full w-full min-h-[36px] flex items-center justify-center bg-blue-100 border border-blue-300 rounded-md shadow-sm transition-colors cursor-default">
                                <span className="text-xs font-bold text-blue-800">แผน</span>
                              </div>
                            ) : (
                              <div className="h-full w-full min-h-[36px] flex items-center justify-center hover:bg-slate-200 rounded transition-colors text-slate-200">
                                -
                              </div>
                            )}
                          </td>
                        );
                      })}
                    </tr>
                  );
                })}
                {trainees.length === 0 && (
                  <tr>
                    <td colSpan={dates.length + 3} className="px-6 py-8 text-center text-slate-500">ไม่พบข้อมูลพนักงานที่ค้นหา</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function EvaluationView({ trainees, searchQuery, setSearchQuery, onEvaluate, Icons }) {
      return (
        <div className="bg-white rounded-xl shadow-sm border border-slate-100 flex flex-col h-[calc(100vh-180px)]">
          <div className="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50 rounded-t-xl gap-3">
            <h2 className="text-xl font-bold text-slate-800">ประเมินผลการอบรม</h2>
            <div className="relative w-full sm:w-auto">
              <Icons.Search className="h-5 w-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400" />
              <input 
                type="text" 
                placeholder="ค้นหาชื่อ หรือ รหัส..." 
                className="pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full sm:w-64"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
            </div>
          </div>

          <div className="overflow-x-auto flex-1">
            <table className="w-full text-sm text-left min-w-max">
              <thead className="text-xs text-slate-600 uppercase bg-slate-100 sticky top-0 z-10">
                <tr>
                  <th className="px-4 py-3 font-semibold">ผู้เข้าอบรม</th>
                  <th className="px-3 py-3 font-semibold">สถานะปัจจุบัน</th>
                  <th className="px-3 py-3 font-semibold text-center">ปรับเปลวไฟ</th>
                  <th className="px-3 py-3 font-semibold text-center">คุณภาพ</th>
                  <th className="px-3 py-3 font-semibold text-center">เติมลวด</th>
                  <th className="px-3 py-3 font-semibold text-center">รวม</th>
                  <th className="px-4 py-3 font-semibold text-right">การจัดการ</th>
                </tr>
              </thead>
              <tbody>
                {trainees.map((t, idx) => {
                  const total = (t.scores?.flame || 0) + (t.scores?.quality || 0) + (t.scores?.wire || 0);
                  const hasScores = t.scores?.flame !== null && t.scores?.flame !== undefined;

                  return (
                    <tr key={t.id} className={`border-b border-slate-50 hover:bg-blue-50 ${idx % 2 === 0 ? 'bg-white' : 'bg-slate-50/50'}`}>
                      <td className="px-4 py-4">
                        <div className="font-medium text-slate-800">{t.name}</div>
                        <div className="text-xs text-slate-500">{t.id} (Line: {t.line})</div>
                      </td>
                      <td className="px-3 py-4"><StatusBadge status={t.status} Icons={Icons} /></td>
                      <td className="px-3 py-4 text-center">{hasScores ? t.scores.flame : '-'}</td>
                      <td className="px-3 py-4 text-center">{hasScores ? t.scores.quality : '-'}</td>
                      <td className="px-3 py-4 text-center">{hasScores ? t.scores.wire : '-'}</td>
                      <td className="px-3 py-4 text-center font-bold text-slate-700">{hasScores ? total : '-'}</td>
                      <td className="px-4 py-4 text-right">
                        <button 
                          onClick={() => onEvaluate(t)}
                          className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-xs font-medium inline-flex items-center"
                        >
                          <Icons.ClipboardCheck className="w-4 h-4 mr-1" /> ให้คะแนน
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function EvaluationModal({ trainee, onClose, onSave, saving, Icons }) {
      const [scores, setScores] = useState(trainee.tempScores);

      const handleChange = (field, value) => {
        let numVal = parseInt(value, 10);
        if (isNaN(numVal)) numVal = '';
        if (numVal > 10) numVal = 10;
        if (numVal < 0) numVal = 0;
        setScores(prev => ({ ...prev, [field]: numVal }));
      };

      const total = (Number(scores.flame) || 0) + (Number(scores.quality) || 0) + (Number(scores.wire) || 0);
      const isPassed = total >= 25;

      return (
        <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center z-50 p-4">
          <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden relative">
            {saving && (
               <div className="absolute inset-0 bg-white/60 z-10 flex items-center justify-center">
                  <div className="loader"></div>
               </div>
            )}
            <div className="bg-blue-600 px-5 py-3 flex justify-between items-center">
              <h3 className="text-white font-bold text-lg flex items-center">
                <Icons.ClipboardCheck className="w-5 h-5 mr-2" />
                แบบประเมินผลการอบรม
              </h3>
              <button onClick={onClose} className="text-blue-100 hover:text-white"><Icons.X className="w-5 h-5" /></button>
            </div>

            <div className="p-5 space-y-5">
              <div className="bg-slate-50 p-3 rounded-lg border border-slate-100 text-sm">
                <p className="text-slate-500">รหัส: <span className="font-semibold text-slate-800">{trainee.id}</span></p>
                <p className="text-slate-500">ชื่อ: <span className="font-semibold text-slate-800">{trainee.name}</span></p>
              </div>

              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <label className="text-sm font-medium text-slate-700">1. การปรับเปลวไฟ (เต็ม 10)</label>
                  <input type="number" min="0" max="10" value={scores.flame} onChange={(e) => handleChange('flame', e.target.value)}
                    className="w-20 text-center border border-slate-300 rounded p-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold" />
                </div>
                <div className="flex items-center justify-between">
                  <label className="text-sm font-medium text-slate-700">2. คุณภาพการเชื่อม (เต็ม 10)</label>
                  <input type="number" min="0" max="10" value={scores.quality} onChange={(e) => handleChange('quality', e.target.value)}
                    className="w-20 text-center border border-slate-300 rounded p-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold" />
                </div>
                <div className="flex items-center justify-between">
                  <label className="text-sm font-medium text-slate-700">3. การเติมลวดเชื่อม (เต็ม 10)</label>
                  <input type="number" min="0" max="10" value={scores.wire} onChange={(e) => handleChange('wire', e.target.value)}
                    className="w-20 text-center border border-slate-300 rounded p-1.5 focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold" />
                </div>
              </div>

              <div className={`p-4 rounded-lg border flex justify-between items-center ${isPassed ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}`}>
                <div>
                  <p className="text-xs text-slate-600 mb-0.5">คะแนนรวม</p>
                  <p className={`text-2xl font-black ${isPassed ? 'text-green-600' : 'text-red-600'}`}>{total} <span className="text-sm font-normal text-slate-500">/ 30</span></p>
                </div>
                <div className="text-right">
                  <p className="text-xs text-slate-600 mb-0.5">ผลการประเมิน</p>
                  {isPassed ? (
                    <span className="inline-flex items-center px-2 py-1 rounded-full text-xs font-bold bg-green-200 text-green-800"><Icons.CheckCircle2 className="w-3 h-3 mr-1" /> ผ่าน</span>
                  ) : (
                    <span className="inline-flex items-center px-2 py-1 rounded-full text-xs font-bold bg-red-200 text-red-800"><Icons.XCircle className="w-3 h-3 mr-1" /> ไม่ผ่าน</span>
                  )}
                </div>
              </div>
            </div>

            <div className="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-end space-x-2">
              <button onClick={onClose} disabled={saving} className="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded">ยกเลิก</button>
              <button onClick={() => onSave(trainee.id, scores)} disabled={saving} className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded flex items-center">
                <Icons.Save className="w-4 h-4 mr-2" /> บันทึกผล
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
